name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build
        run: npm run build
        
      - name: Verify dist
        run: |
          echo "=== DIST INDEX ==="
          cat dist/index.html
          echo "=== DIST FILES ==="
          find dist -maxdepth 2 -type f | sort

      - name: Extended Diagnostics
        run: |
          echo "=== COMMIT SHA ==="
          git rev-parse HEAD || echo "Not a git repo locally"
          echo "=== GENERATED DIST INDEX.HTML ==="
          cat dist/index.html
          echo "=== DIST TREE ==="
          find dist -maxdepth 3 -type f | sort
          echo "=== DIST CHECKSUMS ==="
          find dist -type f -print0 | sort -z | xargs -0 sha256sum
          
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
